spring:
  application:
    name: beautyboy
  # TODO(Task 4): 인증/인가 구현 후 아래 exclude 제거
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/beautyboy}
    username: ${DB_USERNAME:beautyboy}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:}
  access-exp-minutes: 30
  refresh-exp-days: 14
