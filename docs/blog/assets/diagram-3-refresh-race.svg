<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" font-family="Apple SD Gothic Neo, Pretendard, -apple-system, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141414"/>
    </marker>
    <marker id="arrow3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9372c"/>
    </marker>
    <marker id="arrow3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect width="1440" height="760" fill="#ffffff"/>
  <text x="60" y="66" font-size="30" font-weight="700" fill="#141414">같은 리프레시 토큰, 동시 요청 — 패자가 받는 응답이 모든 것을 갈랐다</text>

  <!-- ============ BEFORE ============ -->
  <rect x="60" y="104" width="620" height="560" rx="16" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="90" y="148" font-size="22" font-weight="700" fill="#c9372c">Before — 500이 승자의 세션까지 지운다</text>

  <!-- lifeline headers -->
  <g font-size="18" font-weight="700" fill="#141414" text-anchor="middle">
    <rect x="100" y="170" width="120" height="46" rx="9" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <text x="160" y="200">탭 A</text>
    <rect x="310" y="170" width="120" height="46" rx="9" fill="#141414"/>
    <text x="370" y="200" fill="#ffffff">서버</text>
    <rect x="520" y="170" width="120" height="46" rx="9" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <text x="580" y="200">탭 B</text>
  </g>
  <g stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 6">
    <line x1="160" y1="216" x2="160" y2="600"/>
    <line x1="370" y1="216" x2="370" y2="600"/>
    <line x1="580" y1="216" x2="580" y2="600"/>
  </g>

  <!-- messages -->
  <line x1="160" y1="256" x2="364" y2="256" stroke="#141414" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="262" y="246" text-anchor="middle" font-size="15" fill="#141414">POST /auth/refresh</text>

  <line x1="580" y1="290" x2="376" y2="290" stroke="#141414" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="478" y="280" text-anchor="middle" font-size="15" fill="#141414">같은 토큰으로 refresh</text>

  <line x1="370" y1="336" x2="166" y2="336" stroke="#1f7a4d" stroke-width="2" marker-end="url(#arrow3g)"/>
  <text x="262" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#1f7a4d">200 — 새 세션 발급 (승자)</text>

  <line x1="370" y1="392" x2="574" y2="392" stroke="#c9372c" stroke-width="2" marker-end="url(#arrow3r)"/>
  <text x="478" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#c9372c">500</text>
  <text x="478" y="386" text-anchor="middle" font-size="13" fill="#c9372c">ObjectOptimisticLockingFailure</text>

  <rect x="440" y="420" width="220" height="72" rx="10" fill="#ffffff" stroke="#c9372c" stroke-width="1.5"/>
  <text x="550" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#c9372c">clear()</text>
  <text x="550" y="474" text-anchor="middle" font-size="14" fill="#6b6b6b">실패 원인 불문 세션 파괴</text>

  <text x="370" y="548" text-anchor="middle" font-size="19" font-weight="800" fill="#c9372c">승자 A가 방금 받은 세션까지 삭제</text>
  <text x="370" y="578" text-anchor="middle" font-size="16" fill="#6b6b6b">→ 전 탭 로그아웃. 서버의 미분류 500이 프론트에서 증폭됐다</text>

  <!-- ============ AFTER ============ -->
  <rect x="760" y="104" width="620" height="560" rx="16" fill="#fafafa" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="790" y="148" font-size="22" font-weight="700" fill="#1f7a4d">After — 409는 세션을 유지한다</text>

  <g font-size="18" font-weight="700" fill="#141414" text-anchor="middle">
    <rect x="800" y="170" width="120" height="46" rx="9" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <text x="860" y="200">탭 A</text>
    <rect x="1010" y="170" width="120" height="46" rx="9" fill="#141414"/>
    <text x="1070" y="200" fill="#ffffff">서버</text>
    <rect x="1220" y="170" width="120" height="46" rx="9" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <text x="1280" y="200">탭 B</text>
  </g>
  <g stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 6">
    <line x1="860" y1="216" x2="860" y2="600"/>
    <line x1="1070" y1="216" x2="1070" y2="600"/>
    <line x1="1280" y1="216" x2="1280" y2="600"/>
  </g>

  <line x1="860" y1="256" x2="1064" y2="256" stroke="#141414" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="962" y="246" text-anchor="middle" font-size="15" fill="#141414">POST /auth/refresh</text>

  <line x1="1280" y1="290" x2="1076" y2="290" stroke="#141414" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="1178" y="280" text-anchor="middle" font-size="15" fill="#141414">같은 토큰으로 refresh</text>

  <line x1="1070" y1="336" x2="866" y2="336" stroke="#1f7a4d" stroke-width="2" marker-end="url(#arrow3g)"/>
  <text x="962" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#1f7a4d">200 — 새 세션 발급 (승자)</text>

  <line x1="1070" y1="392" x2="1274" y2="392" stroke="#141414" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="1178" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#141414">409 AUTH_REFRESH_CONFLICT</text>
  <text x="1178" y="386" text-anchor="middle" font-size="13" fill="#6b6b6b">삭제 영향 행 0 = 경쟁 패배 판정</text>

  <rect x="1140" y="420" width="220" height="72" rx="10" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="1250" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#1f7a4d">세션 유지</text>
  <text x="1250" y="474" text-anchor="middle" font-size="14" fill="#6b6b6b">401(진짜 세션 없음)일 때만 파괴</text>

  <text x="1070" y="548" text-anchor="middle" font-size="19" font-weight="800" fill="#1f7a4d">패자도 유효한 세션을 그대로 쓴다</text>
  <text x="1070" y="578" text-anchor="middle" font-size="16" fill="#6b6b6b">+ in-flight 캐시를 refreshSession() 한 벌로 — 중복 요청 자체가 사라짐</text>

  <!-- bottom caption -->
  <text x="720" y="712" text-anchor="middle" font-size="19" font-weight="700" fill="#141414">승패 판정은 예외 타입이 아니라 삭제 영향 행 수로 — H2·InnoDB 어디서나 같은 뜻이다</text>
</svg>
