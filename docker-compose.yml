# 로컬 전용 전체 스택. `docker compose up -d --build` 하나로 DB/백엔드/프론트가 뜬다.
# 시크릿은 .env로 주입한다(.env.example 참고). 운영 값은 절대 여기 적지 않는다.
services:
  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: beautyboy, MYSQL_ROOT_PASSWORD: local1234 }
    # 호스트에 로컬 mysqld가 3306을 점유하는 경우가 많아 호스트 쪽만 13306으로 뺀다.
    # 컨테이너끼리는 여전히 mysql:3306으로 붙는다.
    ports: ["13306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal1234"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 조회수 INCR 버퍼 전용. compose 스택에서는 backend가 REDIS_HOST로 이 컨테이너를 가리키고
  # VIEW_COUNT_REDIS=true로 켠다 — 로컬(비-compose) 실행은 여전히 이게 없어도 뜨고
  # (기본 VIEW_COUNT_REDIS=false), 그때는 조회수를 DB에서 즉시 증가시킨다.
  redis:
    image: redis:7-alpine
    container_name: beautyboy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: beautyboy-kafka
    # 9092는 컨테이너 내부 리스너 포트로 그대로 두고, 호스트 전용 리스너는 29092로 뺀다.
    # 호스트 포트와 컨테이너 내부 리스너 포트를 같은 숫자로 겹쳐 두면 어느 쪽 리스너를
    # 말하는 건지 로그/문서에서 헷갈리기 쉬워서 일부러 다른 번호를 쓴다.
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT_HOST: 호스트에서 뜬 클라이언트(loadtest 프로필 ./gradlew bootRun 등) 전용 리스너.
      # 컨테이너 내부 경로는 여전히 kafka:9092 하나뿐이라 backend 컨테이너의
      # KAFKA_BOOTSTRAP: kafka:9092 설정은 그대로 둔다.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      # 컨테이너 내부에는 여전히 kafka:9092로 광고(backend 컨테이너 경로 불변).
      # 호스트에는 localhost:29092로 광고 — 브로커가 이 주소로 다시 접속하라고 응답해야
      # 호스트에서 뜬 클라이언트가 실제로 데이터를 주고받을 수 있다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"   # 로컬 스택 보호 — 이 이상 필요하면 설계가 틀린 것
    healthcheck:
      # 컨테이너 안에서 localhost:9092를 보므로 내부 PLAINTEXT 리스너를 가리킨다(그대로 둔다).
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    environment:
      # 컨테이너 안에서는 local 프로필(localhost:3306을 가리킴)을 쓰지 않고 환경변수로만 설정한다.
      # useAffectedRows는 여기(URL)가 아니라 application.yml의
      # spring.datasource.hikari.data-source-properties에 있다 — URL을 덮어쓰는 경로가
      # 여럿이라 URL에 매달아 두면 조용히 사라진다(그 사고가 실제로 있었다. 이유는 그 주석 참고).
      DB_URL: jdbc:mysql://mysql:3306/beautyboy
      # 로컬 데모 스택이므로 시드(db/seed)를 읽는 demo 프로필을 켠다.
      # mysql-search를 함께 적는 이유: application.yml의 profiles.group은 "프로필 미지정"일 때만
      # default 그룹(→ mysql-search)을 건다. demo를 켜는 순간 그 그룹이 풀려 검색이 조용히
      # LIKE 폴백으로 강등된다(MysqlFulltextGoodsSearchRepository @Profile("mysql-search")).
      SPRING_PROFILES_ACTIVE: demo,mysql-search
      DB_USERNAME: root
      DB_PASSWORD: local1234
      # Base64 인코딩된 값이어야 한다: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - see .env.example}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      # 컨테이너끼리는 redis:6379로 붙는다. compose 스택 안이므로 조회수 버퍼를 켠다 —
      # Redis가 죽어도 RedisViewCountRecorder는 warn 로그만 남기고 앱은 계속 뜬다(설계상 감수).
      REDIS_HOST: redis
      VIEW_COUNT_REDIS: "true"
      # 컨테이너끼리는 kafka:9092로 붙는다. compose 스택 안이므로 아웃박스 릴레이/컨슈머를 켠다.
      KAFKA_BOOTSTRAP: kafka:9092
      ORDER_EVENTS: "true"
      # 랭킹/목록/궁합 읽기 캐시. Redis가 죽어도 CacheErrorHandler가 예외를 삼키고
      # DB 직행으로 폴백한다(설계상 감수).
      CACHE_REDIS: "true"
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # 액추에이터/curl 없이 확인하려고 bash의 /dev/tcp를 쓴다(temurin 이미지에 bash가 있다).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # 결제창 클라이언트 키. Vite가 빌드 시점에 번들로 굽는 값이라 environment(런타임)로는
        # 늦다 — build.args여야 한다. 비어 있으면 결제창만 안 열리고 나머지는 정상이다.
        VITE_TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    ports: ["3000:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes: { mysql-data: }
