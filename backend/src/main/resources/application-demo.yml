# 로컬·데모 전용. 자격증명이 든 시드 마이그레이션(db/seed: V64·V66·V80)을 추가로 읽는다.
# 이 프로필이 없으면 시드 회원·관리자 계정이 생기지 않는다(application.yml의 flyway.locations 주석).
#
# 주의: 이미 시드가 적용된 DB(compose mysql)에 이 프로필 없이 붙으면 Flyway가
# "applied migration not resolved locally"로 validate에 실패한다 — 히스토리에는 V64가 있는데
# 파일이 안 보이기 때문이다. 그 DB를 쓰는 기동(local·e2e)은 아래 profiles.group으로 묶어 둔다.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
