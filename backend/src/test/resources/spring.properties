# 스프링 테스트 컨텍스트 캐시 크기. 기본값 32.
#
# 왜 올리는가: 캐시가 가득 차면 스프링이 LRU로 컨텍스트를 하나 닫는데, ddl-auto=create-drop이라
# 그 닫힘이 H2 스키마를 DROP한다. 그런데 테스트 대부분이 같은 인메모리 DB
# (jdbc:h2:mem:beautyboy)를 공유하므로, 아직 살아 있는 다른 컨텍스트의 테이블까지 함께 사라진다.
# 증상은 무관해 보이는 테스트의 'Table "brand" not found (this database is empty)'이고,
# 마지막에 도는 클래스가 대신 터진다 — 원인 클래스가 아니라서 추적이 매우 어렵다.
#
# 취소 웨이브에서 컨텍스트가 4개 늘며 실제로 32를 넘겨 wishlist 7건이 그렇게 깨졌다.
# 값 자체에 의미는 없고 "현재 컨텍스트 수보다 넉넉히 크다"가 전부다.
spring.test.context.cache.maxSize=64
