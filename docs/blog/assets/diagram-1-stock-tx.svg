<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" font-family="Apple SD Gothic Neo, Pretendard, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141414"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9372c"/>
    </marker>
  </defs>

  <rect width="1440" height="640" fill="#ffffff"/>

  <text x="60" y="66" font-size="30" font-weight="700" fill="#141414">결제 승인 트랜잭션 — 차감은 토스 호출 앞, 복원은 롤백</text>

  <!-- transaction boundary -->
  <rect x="60" y="110" width="1160" height="230" rx="16" fill="#fafafa" stroke="#141414" stroke-width="2"/>
  <text x="84" y="146" font-size="19" fill="#6b6b6b" font-family="SF Mono, Menlo, monospace">@Transactional — PaymentService.confirm</text>

  <!-- step boxes -->
  <g font-size="20" font-weight="700" fill="#141414">
    <rect x="100"  y="180" width="230" height="100" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <text x="215" y="222" text-anchor="middle">① 주문 행 잠금</text>
    <text x="215" y="252" text-anchor="middle" font-size="15" font-weight="400" fill="#6b6b6b">lockPendingOrder</text>

    <rect x="370"  y="180" width="230" height="100" rx="10" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
    <text x="485" y="222" text-anchor="middle">② 재고 차감</text>
    <text x="485" y="252" text-anchor="middle" font-size="15" font-weight="400" fill="#6b6b6b">UPDATE … AND stock ≥ qty</text>

    <rect x="640"  y="180" width="230" height="100" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <text x="755" y="222" text-anchor="middle">③ 토스 승인</text>
    <text x="755" y="252" text-anchor="middle" font-size="15" font-weight="400" fill="#6b6b6b">외부 HTTP 왕복</text>

    <rect x="910"  y="180" width="230" height="100" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.5"/>
    <text x="1025" y="222" text-anchor="middle">④ PAID 전이</text>
    <text x="1025" y="252" text-anchor="middle" font-size="15" font-weight="400" fill="#6b6b6b">markPaid + 결제 기록</text>
  </g>

  <!-- arrows between steps -->
  <g stroke="#141414" stroke-width="2" marker-end="url(#arrow)">
    <line x1="330" y1="230" x2="364" y2="230"/>
    <line x1="600" y1="230" x2="634" y2="230"/>
    <line x1="870" y1="230" x2="904" y2="230"/>
    <line x1="1220" y1="230" x2="1264" y2="230"/>
  </g>
  <text x="1276" y="238" font-size="20" font-weight="700" fill="#141414">commit</text>

  <!-- branch: sold out -->
  <line x1="485" y1="280" x2="485" y2="384" stroke="#c9372c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="290" y="390" width="390" height="96" rx="10" fill="#ffffff" stroke="#c9372c" stroke-width="1.5"/>
  <text x="485" y="428" text-anchor="middle" font-size="19" font-weight="700" fill="#c9372c">품절: 영향 행 0 → 409 ORDER_OUT_OF_STOCK</text>
  <text x="485" y="460" text-anchor="middle" font-size="16" fill="#6b6b6b">토스 호출 전에 거절 — 승인 취소(보상 호출) 불필요</text>

  <!-- branch: failure after deduction -->
  <line x1="895" y1="280" x2="895" y2="384" stroke="#c9372c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="720" y="390" width="420" height="96" rx="10" fill="#ffffff" stroke="#c9372c" stroke-width="1.5"/>
  <text x="930" y="428" text-anchor="middle" font-size="19" font-weight="700" fill="#c9372c">③·④ 실패: 통신 오류 · 금액 불일치</text>
  <text x="930" y="460" text-anchor="middle" font-size="16" fill="#6b6b6b">예외 → 트랜잭션 전체 롤백</text>

  <!-- rollback = restore caption -->
  <text x="60" y="566" font-size="22" font-weight="700" fill="#141414">차감 이후 어느 단계가 실패해도, 롤백이 차감을 자동으로 되돌린다.</text>
  <text x="60" y="600" font-size="19" fill="#6b6b6b">복원 UPDATE도 복원 배치도 없다 — 롤백이 곧 복원이다. (Propagation.MANDATORY가 이 전제를 강제)</text>
</svg>
