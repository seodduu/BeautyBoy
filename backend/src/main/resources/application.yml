spring:
  application:
    name: beautyboy
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/beautyboy}
    username: ${DB_USERNAME:beautyboy}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # LAZY 컬렉션(@OneToMany)을 부모 100건씩 IN 절로 모아 읽는다. 없으면 주문 목록이
        # "주문 1건 = 항목 쿼리 1건"으로 늘어난다(N+1). 100을 고른 이유는 목록 size 상한과
        # 같은 값이어서다 — 한 페이지를 한 번의 IN으로 덮는 가장 작은 수다.
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
  # default 프로필(명시 프로필 없이 뜨는 운영 경로)에서만 mysql-search를 켠다.
  # `profiles.include`를 쓰면 test 프로필에도 무조건 새어 들어가 H2가 MATCH 문법을
  # 못 읽어 전부 깨진다 — 반드시 group으로 default에만 묶는다.
  profiles:
    group:
      default: mysql-search

beautyboy:
  view-count:
    # 기본은 DB 즉시 증가. Redis 컨테이너가 떠 있을 때만 true로 켠다.
    redis: ${VIEW_COUNT_REDIS:false}
  cache:
    # 기본은 캐시 없음(DB 직행). Redis 컨테이너가 떠 있을 때만 true로 켠다.
    redis: ${CACHE_REDIS:false}

# B5 — 캐시 히트율 관측. 아직 actuator 노출 목록이 없던 상태라 여기서 새로 만든다
# (계획서는 "기존 목록에 병기"를 전제했지만 그런 목록이 존재하지 않았다 — 보고 사항).
# spring-boot-starter-actuator 의존성이 backend/build.gradle.kts에 없어 이 설정 자체는
# 지금 당장은 아무 엔드포인트도 열지 않는다(actuator가 클래스패스에 있어야 관리 대상이 된다).
management:
  endpoints:
    web:
      exposure:
        include: metrics

jwt:
  secret: ${JWT_SECRET:}
  access-exp-minutes: 30
  refresh-exp-days: 14

toss:
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
