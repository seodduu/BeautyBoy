spring:
  application:
    name: beautyboy
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/beautyboy}
    username: ${DB_USERNAME:beautyboy}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        # useAffectedRows=true가 없으면 MySQL JDBC 드라이버가 `INSERT ... ON DUPLICATE KEY UPDATE`의
        # 반환값을 "실제로 바뀐 행 수"가 아니라 "매치된 행 수"로 돌려준다(중복이어도 보통 2) —
        # outbox의 processed_event/notification 멱등성 게이트(영향 행 0 == 중복)가 실 MySQL에서
        # 조용히 깨진다(A7 Testcontainers MySQL 통합 테스트가 실측: 재발행 시 판매집계가 배로 늚).
        #
        # URL 쿼리스트링(`?useAffectedRows=true`)이 아니라 여기에 두는 이유: URL은 프로필마다
        # 통째로 덮어쓰인다. 실제로 application-local.yml이 파라미터 없는 URL로 덮어써서
        # `local,loadtest`(부하 측정 권장 기동)에서는 이 설정이 조용히 사라져 있었다 —
        # 판매 집계만 이중 계상되고 로그도 남지 않는 결함이다. Hikari의 data-source-properties는
        # DriverDataSource가 드라이버 커넥션 프로퍼티로 그대로 넘기므로 URL을 누가 덮어쓰든 살아남는다.
        useAffectedRows: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # LAZY 컬렉션(@OneToMany)을 부모 100건씩 IN 절로 모아 읽는다. 없으면 주문 목록이
        # "주문 1건 = 항목 쿼리 1건"으로 늘어난다(N+1). 100을 고른 이유는 목록 size 상한과
        # 같은 값이어서다 — 한 페이지를 한 번의 IN으로 덮는 가장 작은 수다.
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: beautyboy-post-order
      auto-offset-reset: earliest
      enable-auto-commit: false      # 커밋은 리스너 컨테이너가 처리 성공 후에 한다
  flyway:
    enabled: true
    # 기본은 db/migration 하나뿐이다 — 자격증명 시드(V64·V66·V80)는 db/seed에 있고
    # demo 프로필이 활성일 때만 더해진다(application-demo.yml).
    #
    # 왜 "운영 프로필에서 빼기"가 아니라 "데모 프로필에서 더하기"인가:
    # 프로필을 안 붙이고 뜨는 경로가 곧 배포 경로다(아래 profiles.group.default 주석 참조).
    # 빼는 쪽으로 만들면 프로필을 잊었을 때 결과가 "비밀번호 admin인 ADMIN 계정 생성"이고,
    # 더하는 쪽으로 만들면 "시드 없는 빈 DB"다. 잊었을 때 사고가 나지 않는 쪽을 기본값으로 둔다.
    locations: classpath:db/migration
  # default 프로필(명시 프로필 없이 뜨는 운영 경로)에서만 mysql-search를 켠다.
  # `profiles.include`를 쓰면 test 프로필에도 무조건 새어 들어가 H2가 MATCH 문법을
  # 못 읽어 전부 깨진다 — 반드시 group으로 default에만 묶는다.
  profiles:
    group:
      default: mysql-search
      # 개발자가 매일 쓰는 두 기동은 compose mysql(13306)을 본다 — 이미 V64·V66·V80이
      # 적용된 DB다. demo를 함께 켜지 않으면 flyway validate가 깨져 아예 뜨지 않는다.
      local: demo
      e2e: demo

beautyboy:
  view-count:
    # 기본은 DB 즉시 증가. Redis 컨테이너가 떠 있을 때만 true로 켠다.
    redis: ${VIEW_COUNT_REDIS:false}
  events:
    enabled: ${ORDER_EVENTS:false}   # 조회수 버퍼와 같은 철학 — Kafka 없이도 앱이 뜬다
    relay-batch-size: 100
    relay-delay-ms: 1000
    # 발행 재시도 임계치. 이 횟수에 도달한 아웃박스 행은 status='FAILED'로 격리돼 폴링에서 빠진다(V93).
    # 없으면 영구 실패 한 건이 created_at 최선두에 남아 뒤의 모든 주문 이벤트를 영영 막는다.
    # 10인 이유: relay-delay-ms 1초 기준 약 10초. 브로커 재기동 같은 일시적 장애는 대개 이 안에
    # 회복되지 않으므로, 회복되면 그때 PENDING으로 되돌려 재발행한다. 일시적 실패를 성급히
    # 포기하는 쪽보다 영구 실패가 전체를 막는 쪽이 훨씬 나쁘다고 보고 정한 값이다.
    relay-max-attempts: 10
  cache:
    # 기본은 캐시 없음(DB 직행). Redis 컨테이너가 떠 있을 때만 true로 켠다.
    redis: ${CACHE_REDIS:false}

# B5 — 캐시 히트율 관측. 아직 actuator 노출 목록이 없던 상태라 여기서 새로 만든다
# (계획서는 "기존 목록에 병기"를 전제했지만 그런 목록이 존재하지 않았다 — 보고 사항).
# actuator가 이제 클래스패스에 있다(backend/build.gradle.kts). exposure.include를 지정하면
# Spring Boot 기본값(health만 노출)을 완전히 덮어써버리므로 health를 반드시 같이 적는다 —
# 안 그러면 compose 등에서 상태 확인용으로 health를 쓰려 할 때 막힌다.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

jwt:
  secret: ${JWT_SECRET:}
  access-exp-minutes: 30
  refresh-exp-days: 14

toss:
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
