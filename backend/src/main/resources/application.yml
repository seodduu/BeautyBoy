spring:
  application:
    name: beautyboy
  datasource:
    # useAffectedRows=true가 없으면 MySQL JDBC 드라이버가 `INSERT ... ON DUPLICATE KEY UPDATE`의
    # 반환값을 "실제로 바뀐 행 수"가 아니라 "매치된 행 수"로 돌려준다(중복이어도 보통 2) —
    # outbox의 processed_event/notification 멱등성 게이트(영향 행 0 == 중복)가 실 MySQL에서
    # 조용히 깨진다(A7 Testcontainers MySQL 통합 테스트가 실측: 재발행 시 판매집계가 배로 늚).
    url: ${DB_URL:jdbc:mysql://localhost:3306/beautyboy?useAffectedRows=true}
    username: ${DB_USERNAME:beautyboy}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # LAZY 컬렉션(@OneToMany)을 부모 100건씩 IN 절로 모아 읽는다. 없으면 주문 목록이
        # "주문 1건 = 항목 쿼리 1건"으로 늘어난다(N+1). 100을 고른 이유는 목록 size 상한과
        # 같은 값이어서다 — 한 페이지를 한 번의 IN으로 덮는 가장 작은 수다.
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: beautyboy-post-order
      auto-offset-reset: earliest
      enable-auto-commit: false      # 커밋은 리스너 컨테이너가 처리 성공 후에 한다
  flyway:
    enabled: true
  # default 프로필(명시 프로필 없이 뜨는 운영 경로)에서만 mysql-search를 켠다.
  # `profiles.include`를 쓰면 test 프로필에도 무조건 새어 들어가 H2가 MATCH 문법을
  # 못 읽어 전부 깨진다 — 반드시 group으로 default에만 묶는다.
  profiles:
    group:
      default: mysql-search

beautyboy:
  view-count:
    # 기본은 DB 즉시 증가. Redis 컨테이너가 떠 있을 때만 true로 켠다.
    redis: ${VIEW_COUNT_REDIS:false}
  events:
    enabled: ${ORDER_EVENTS:false}   # 조회수 버퍼와 같은 철학 — Kafka 없이도 앱이 뜬다
    relay-batch-size: 100
    relay-delay-ms: 1000

jwt:
  secret: ${JWT_SECRET:}
  access-exp-minutes: 30
  refresh-exp-days: 14

toss:
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
